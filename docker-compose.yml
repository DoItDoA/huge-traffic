version: '3.8'

services:
  # Article Service
  article-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.article
    container_name: article-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME_ARTICLE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # Comment Service
  comment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.comment
    container_name: comment-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME_COMMENT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "9001:9001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # Like Service
  like-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.like
    container_name: like-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME_LIKE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "9002:9002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # View Service
  view-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.view
    container_name: view-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME_VIEW}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "9003:9003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # Hot Article Service
  hot-article-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.hot-article
    container_name: hot-article-service
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ARTICLE_SERVICE_URL: ${ARTICLE_SERVICE_URL}
    ports:
      - "9004:9004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # Article Read Service
  article-read-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.article-read
    container_name: article-read-service
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ARTICLE_SERVICE_URL: ${ARTICLE_SERVICE_URL}
      COMMENT_SERVICE_URL: ${COMMENT_SERVICE_URL}
      LIKE_SERVICE_URL: ${LIKE_SERVICE_URL}
      VIEW_SERVICE_URL: ${VIEW_SERVICE_URL}
    ports:
      - "9005:9005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 